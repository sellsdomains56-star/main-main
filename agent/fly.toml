# Fly.io, from this folder: `fly launch --copy-config --no-deploy`, then
#   fly volumes create dizz_data --size 3
#   fly secrets set ANTHROPIC_API_KEY=... XAI_API_KEY=... PUBLIC_URL=https://<app>.fly.dev
# One machine that never sleeps, so reminders and scheduled tasks run on time.
app = "dizz-lab"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  CODE_EXECUTION = "sandbox"

[mounts]
  source = "dizz_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
