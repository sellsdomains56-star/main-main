<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arabic Transcriber</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <header class="header">
    <h1>Arabic Transcriber</h1>
    <span class="header-ar" lang="ar" dir="rtl">تفريغ الكلام العربي</span>
  </header>

  <section class="card source">
    <div class="source-text">
      <div class="label">Sequence</div>
      <div id="seq-name" class="seq-name">—</div>
      <div id="seq-range" class="hint"></div>
    </div>
    <button id="refresh" class="icon-button" title="Refresh">&#8635;</button>
  </section>

  <button id="engine-summary" class="engine-summary" type="button"></button>

  <button id="transcribe" class="button primary wide" type="button">Transcribe Arabic speech</button>

  <div id="progress" class="progress" hidden>
    <div class="bar"><div id="progress-fill" class="fill"></div></div>
    <div class="progress-row">
      <span id="progress-text" class="hint"></span>
      <button id="cancel" class="link-button" type="button">Cancel</button>
    </div>
  </div>

  <div id="message" class="message" hidden></div>

  <section id="results" class="results" hidden>
    <div class="results-head">
      <span id="results-title" class="label"></span>
      <button id="clear" class="link-button" type="button">Clear</button>
    </div>
    <div class="actions">
      <button id="add-captions" class="button primary" type="button">Add captions to sequence</button>
      <button id="add-markers" class="button" type="button">Add as markers</button>
      <button id="save-srt" class="button" type="button">Save SRT…</button>
      <button id="copy-text" class="button" type="button">Copy text</button>
    </div>
    <div class="hint">Click a time to jump there. Click the text to correct it.</div>
    <div id="segments" class="segments"></div>
  </section>

  <details id="settings" class="settings">
    <summary>Settings</summary>

    <fieldset>
      <legend>Speech recognition</legend>
      <label class="radio"><input type="radio" name="engine" value="api" data-setting="engine"> Online API (OpenAI, Groq…)</label>
      <label class="radio"><input type="radio" name="engine" value="whisper" data-setting="engine"> Offline on this computer (whisper.cpp)</label>

      <div id="api-settings">
        <label class="field">Service
          <select id="api-service" data-setting="apiService">
            <option value="openai">OpenAI</option>
            <option value="groq">Groq (fast, whisper-large-v3)</option>
            <option value="custom">Other OpenAI-compatible server</option>
          </select>
        </label>
        <label class="field">API key
          <input type="password" data-setting="apiKey" autocomplete="off" spellcheck="false" placeholder="sk-…">
        </label>
        <label class="field">Server URL
          <input type="text" id="api-base-url" data-setting="apiBaseUrl" spellcheck="false">
        </label>
        <label class="field">Model
          <input type="text" id="api-model" data-setting="apiModel" spellcheck="false">
        </label>
      </div>

      <div id="whisper-settings">
        <div class="field">whisper.cpp program (whisper-cli)
          <div class="path-row">
            <input type="text" data-setting="whisperBinary" spellcheck="false" placeholder="/opt/homebrew/bin/whisper-cli">
            <button class="button small" type="button" data-choose="whisperBinary">Choose…</button>
          </div>
        </div>
        <div class="field">Model file (ggml-large-v3.bin recommended)
          <div class="path-row">
            <input type="text" data-setting="whisperModel" spellcheck="false" placeholder="ggml-large-v3.bin">
            <button class="button small" type="button" data-choose="whisperModel">Choose…</button>
          </div>
        </div>
      </div>

      <label class="field">Language
        <select data-setting="language">
          <option value="ar">Arabic</option>
          <option value="auto">Detect automatically (mixed Arabic / English)</option>
        </select>
      </label>
      <label class="field">Names and terms (optional)
        <input type="text" data-setting="prompt" dir="auto" lang="ar" placeholder="مثال: محمد، دبي، أدوبي بريميير">
      </label>
      <label class="check"><input type="checkbox" data-setting="filterHallucinations"> Remove lines Whisper invents over silence</label>
    </fieldset>

    <fieldset>
      <legend>Captions</legend>
      <div class="field-row">
        <label class="field">Characters per line
          <input type="number" min="16" max="80" data-setting="maxCharsPerLine">
        </label>
        <label class="field">Lines per caption
          <select data-setting="maxLines" data-type="number">
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </label>
      </div>
      <label class="check"><input type="checkbox" data-setting="removeDiacritics"> Remove diacritics (tashkeel)</label>
      <label class="check"><input type="checkbox" data-setting="rtlMark"> Add right-to-left marks (use if punctuation shows on the wrong side)</label>
    </fieldset>

    <fieldset>
      <legend>Advanced</legend>
      <div class="field">Audio export preset (.epr)
        <div class="path-row">
          <input type="text" data-setting="presetPath" spellcheck="false" placeholder="Automatic (Premiere's WAV preset)">
          <button class="button small" type="button" data-choose="presetPath">Choose…</button>
        </div>
      </div>
      <label class="field">Part length (minutes, keeps uploads under 25 MB)
        <input type="number" min="1" max="12" data-setting="partMinutes">
      </label>
    </fieldset>
  </details>

  <script src="js/lib/wav.js"></script>
  <script src="js/lib/captions.js"></script>
  <script src="js/lib/engines.js"></script>
  <script src="js/host.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
