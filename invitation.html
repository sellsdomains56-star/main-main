<style>
/* Layout: two phone-shaped photos of a cream card on linen with ribbon. Text is printed on the card. Page 1 title, page 2 details. */
:root{
  --linen:#d9c9ac;
  --ink:#7a6040;
  --ink-soft:#8f775a;
  --line:rgba(122,96,64,.55);
  --serif:'Cormorant Garamond','Times New Roman',serif;
  --script:'Alex Brush','Snell Roundhand',cursive;
  --name:'Cormorant Garamond','Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--linen);color:var(--ink);font-family:var(--serif);font-variant-numeric:lining-nums;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
#app[lang="ar"]{--serif:'Tajawal','Segoe UI',Tahoma,sans-serif;--script:'Amiri','Times New Roman',serif;--name:'Amiri','Times New Roman',serif}

.page{position:relative;width:min(100%,56.25svh);min-width:min(100%,340px);aspect-ratio:9/16;margin:0 auto;overflow:hidden;
  background:var(--linen) center/cover no-repeat}
#cover{background-image:url(bg1.jpg)}
#details{background-image:url(bg2.jpg)}
.card{position:absolute;left:12.6%;top:21.2%;width:75%;height:57.6%;container-type:inline-size;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6%}
#details .card{left:12.4%}

.caps{font-family:var(--serif);font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:3.8cqw;line-height:1.85;padding-inline-start:.2em}
#app[lang="ar"] .caps{letter-spacing:0;text-transform:none;font-size:4.6cqw;padding:0;line-height:1.75;font-weight:400}
.name{font-family:var(--name);font-weight:400;text-transform:uppercase;letter-spacing:.14em;font-size:11.5cqw;line-height:1.15;padding-inline-start:.14em}
#app[lang="ar"] .name{letter-spacing:0;padding:0;font-size:13.5cqw;line-height:1.45;font-weight:400}
.and{display:flex;align-items:center;justify-content:center;gap:3cqw;width:100%;font-family:var(--script);font-size:8cqw;line-height:1.05;margin:.8cqw 0}
#app[lang="ar"] .and{font-size:7cqw;margin:-1.5cqw 0 -1cqw}
.and i{width:15cqw;height:1px;background:var(--line)}
.sprig{width:36cqw;margin:3cqw 0;color:var(--ink)}
.when{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;margin:1.5cqw 0 3.5cqw}
.when .side{font-weight:500;font-size:3.5cqw;letter-spacing:.2em;text-transform:uppercase}
#app[lang="ar"] .when .side{letter-spacing:0;font-size:5cqw;text-transform:none;font-weight:400}
.when .mid{border-inline:1px solid var(--line);padding:0 5.5cqw;margin:0 4cqw;display:flex;flex-direction:column;align-items:center}
.when .num{font-size:10cqw;line-height:1;font-weight:400}
.when .mo{font-size:3.5cqw;letter-spacing:.2em;text-transform:uppercase;font-weight:500;line-height:1.7;padding-inline-start:.2em}
#app[lang="ar"] .when .mo{letter-spacing:0;font-size:4.6cqw;text-transform:none;padding:0;font-weight:400}
.rule{display:flex;align-items:center;gap:2cqw;margin:3cqw 0 2.5cqw}
.rule i{width:16cqw;height:1px;background:var(--line)}
.rule b{width:1.5cqw;height:1.5cqw;transform:rotate(45deg);background:var(--ink)}
.scan{font-size:3.3cqw}
#app[lang="ar"] .scan{font-size:4.2cqw}
.qrlink{display:block;margin-top:2cqw;color:#5d4a33;line-height:0}
.qr{width:19cqw;height:19cqw}

/* cover */
#cover .title{font-size:4.6cqw;letter-spacing:.3em;padding-inline-start:.3em;margin-bottom:6cqw}
#app[lang="ar"] #cover .title{font-size:7cqw;letter-spacing:0;padding:0;margin-bottom:3cqw}
#cover .name{font-size:15cqw}
#app[lang="ar"] #cover .name{font-size:18cqw}
#cover .cdate{font-size:4.6cqw;letter-spacing:.3em;margin-top:1cqw;padding-inline-start:.3em;direction:ltr}
.scroll{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;
  color:#5d4a33;text-decoration:none;font:500 clamp(10px,2.9vw,13px)/1.2 var(--serif);letter-spacing:.3em;text-transform:uppercase;padding:9px 18px 7px;
  background:rgba(247,240,228,.82);border-radius:40px;white-space:nowrap}
#app[lang="ar"] .scroll{letter-spacing:0;font-size:clamp(13px,3.6vw,15px);text-transform:none}
.scroll svg{width:20px;height:20px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(4px);opacity:1}}
.hint{font-size:3cqw;color:var(--ink-soft);margin-top:7cqw;font-style:italic}
#app[lang="ar"] .hint{font-style:normal;font-size:3.8cqw}
.scroll:focus-visible,.qrlink:focus-visible,.ctl:focus-visible{outline:2px solid #5d4a33;outline-offset:3px}

/* controls */
.ctls{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.ctl{height:38px;min-width:38px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  background:rgba(247,240,228,.88);backdrop-filter:blur(6px);border:1px solid var(--line);color:#5d4a33;
  font:500 14px/1 'Cormorant Garamond','Tajawal',serif;letter-spacing:.06em;border-radius:19px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:2px;background:var(--ink);animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}
.ctl[aria-pressed="false"] .bars i{animation:none;height:3px!important}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.scroll svg,.bars i{animation:none}}

/* PDF mode */
.print .page{width:120mm;min-width:0;height:212.8mm;aspect-ratio:auto}
.print .ctls,.print .hint{display:none}
.print .scroll{font-size:11px}
</style>
