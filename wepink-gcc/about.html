  <script>
    // Set language and direction before first paint so Arabic and Portuguese visitors never see a flash of English layout.
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("lang");
        var nav = (navigator.language || "").toLowerCase().slice(0, 2);
        var l = q || JSON.parse(localStorage.getItem("wpg.lang") || "null") || (nav === "ar" || nav === "pt" ? nav : "en");
        if (l === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
        else if (l === "pt") document.documentElement.lang = "pt-BR";
      } catch (e) {}
      // Black or white: the shopper's saved choice, else the device's setting.
      try {
        var tone = JSON.parse(localStorage.getItem("wpg.tone") || "null");
      } catch (e) {}
      if (tone !== "noir" && tone !== "blanc") tone = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "noir" : "blanc";
      document.documentElement.setAttribute("data-tone", tone);
    })();
  </script>
