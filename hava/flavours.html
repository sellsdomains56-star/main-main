<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="HAVA: still and sparkling water from Sweden. The essence of Sweden.">
<meta name="theme-color" content="#04101B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%2304101B'/%3E%3Ccircle cx='20' cy='20' r='15' fill='none' stroke='%23C9A66B' stroke-width='1.6'/%3E%3Cpath d='M14.5 25.5L20 13.5L25.5 25.5' fill='none' stroke='%23C9A66B' stroke-width='1.8'/%3E%3C/svg%3E">
<title>HAVA · Flavours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="flavours" data-title="nav.flavours">

<main>
  <section class="fl-stage" id="stage">
    <div class="fl-glow"></div>
    <div class="fl-ghost" id="fl-ghost" aria-hidden="true">LINGON</div>
    <canvas class="fl-canvas" id="fl-canvas" aria-hidden="true"></canvas>
    <div></div>
    <div class="fl-ui">
      <div class="fl-now" aria-live="polite">
        <span class="eyebrow" data-i18n="flavours.eyebrow">Sparkling flavours</span>
        <h1 class="fl-name" id="fl-name" data-i18n="fl.lingon">Lingonberry</h1>
        <p class="fl-sv" id="fl-sv" lang="sv">Lingon</p>
        <p class="fl-desc" id="fl-desc" data-i18n="fl.lingon.p">Tart and bright, like the red berries of the autumn forest.</p>
      </div>
      <div class="fl-nav">
        <p class="fl-hint" data-i18n="flavours.drag">Drag to turn the can</p>
        <div class="fl-arrows">
          <button class="fl-arrow" type="button" data-step="-1" aria-label="Previous" data-i18n-attr="aria-label:ui.prev">←</button>
          <button class="fl-arrow" type="button" data-step="1" aria-label="Next" data-i18n-attr="aria-label:ui.next">→</button>
        </div>
        <div class="fl-picker" role="group" aria-label="Choose a flavour" data-i18n-attr="aria-label:flavours.pick">
          <button class="fl-pick" type="button" data-flavour="0" aria-pressed="true"><canvas aria-hidden="true"></canvas><span data-i18n="fl.lingon">Lingonberry</span></button>
          <button class="fl-pick" type="button" data-flavour="1" aria-pressed="false"><canvas aria-hidden="true"></canvas><span data-i18n="fl.hjortron">Cloudberry</span></button>
          <button class="fl-pick" type="button" data-flavour="2" aria-pressed="false"><canvas aria-hidden="true"></canvas><span data-i18n="fl.flader">Elderflower</span></button>
          <button class="fl-pick" type="button" data-flavour="3" aria-pressed="false"><canvas aria-hidden="true"></canvas><span data-i18n="fl.blabar">Wild blueberry</span></button>
          <button class="fl-pick" type="button" data-flavour="4" aria-pressed="false"><canvas aria-hidden="true"></canvas><span data-i18n="fl.gurka">Cucumber &amp; mint</span></button>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap section-head" style="margin-bottom:0">
      <div>
        <span class="eyebrow" data-i18n="water.f3t">Five flavours</span>
        <h2 class="title" data-i18n="flavours.title">Five flavours of Sweden</h2>
      </div>
      <div style="display:grid;gap:1.6rem;justify-items:start">
        <p class="lead" data-i18n="flavours.lead">Sparkling HAVA with a light taste of Nordic berries, flowers and garden. 330 ml cans.</p>
        <a class="btn btn-gold arrow" href="contact.html#cans" data-i18n="flavours.cta">Order the flavours</a>
      </div>
    </div>
  </section>
</main>

<script src="js/i18n.js"></script>
<script src="js/site.js"></script>
<script src="js/cans.js"></script>
<script src="js/flavours.js"></script>
</body>
</html>
